name: Build APK FloatAI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/floatai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FloatAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.floatai'
              compileSdk 34
              
              defaultConfig { 
                  applicationId "com.example.floatai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0" 
              }
              
              buildTypes { 
                  release { minifyEnabled false } 
                  debug { minifyEnabled false }
              }
              
              compileOptions { 
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17 
              }
              
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:allowBackup="true" android:icon="@drawable/app_icon" android:label="FloatAI" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00B8D4" android:pathData="M54,30 C40,30 30,40 30,54 C30,60 32,66 36,70 L36,78 L72,78 L72,70 C76,66 78,60 78,54 C78,40 68,30 54,30 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M44,50 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M64,50 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/>
              <path android:fillColor="#00B8D4" android:pathData="M50,30 L50,20 M58,30 L58,20 M50,20 A4,4 0 0,1 58,20" android:strokeWidth="2" android:strokeColor="#00B8D4"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/robot_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00B8D4" android:pathData="M12,2 C8,2 5,5 5,9 C5,11 6,13 7,14 L7,18 L17,18 L17,14 C18,13 19,11 19,9 C19,5 16,2 12,2 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M9,8 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M15,8 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0"/>
              <path android:fillColor="#00B8D4" android:pathData="M10,2 L10,0 M14,2 L14,0" android:strokeWidth="1" android:strokeColor="#00B8D4"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_notification.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,17c-0.55,0 -1,-0.45 -1,-1s0.45,-1 1,-1 1,0.45 1,1 -0.45,1 -1,1zM13,13h-2V7h2v6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp" android:background="#FFFFFF">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FloatAI" android:textColor="#00B8D4" android:textSize="32sp" android:textStyle="bold" android:layout_marginBottom="24dp"/>
              <EditText android:id="@+id/etApiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Masukkan API Key Groq (gsk_...)" android:layout_marginBottom="16dp"/>
              <Button android:id="@+id/btnStart" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Aktifkan Robot" android:backgroundTint="#00B8D4" android:layout_marginBottom="16dp"/>
              <Button android:id="@+id/btnStop" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Matikan Robot" android:backgroundTint="#FF1744"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
              <ImageView android:layout_width="match_parent" android:layout_height="match_parent" android:src="@drawable/robot_icon" android:scaleType="fitCenter"/>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="220dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="#FFFFFF" android:padding="16dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="AI Assistant" android:textColor="#000000" android:textStyle="bold" android:textSize="16sp" android:layout_marginBottom="12dp"/>
              <LinearLayout android:id="@+id/menuJawab" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📝 Jawab Singkat" android:textColor="#000000" android:textSize="14sp"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/menuPenjelasan" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📖 Penjelasan Lengkap" android:textColor="#000000" android:textSize="14sp"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                  <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="🕵️ Mode Samaran" android:textColor="#000000" android:textSize="14sp"/>
                  <Switch android:id="@+id/switchSamaran" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_loading.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#88000000">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="vertical" android:layout_gravity="center" android:gravity="center">
                  <ProgressBar android:layout_width="wrap_content" android:layout_height="wrap_content" android:indeterminateTint="#00B8D4"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Menjawab soal..." android:textColor="#00B8D4" android:textStyle="bold" android:layout_marginTop="16dp"/>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_answer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="300dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="#EE1E1E1E" android:padding="16dp">
              <ScrollView android:layout_width="match_parent" android:layout_height="wrap_content" android:maxHeight="400dp">
                  <TextView android:id="@+id/tvAnswer" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="14sp"/>
              </ScrollView>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/MainActivity.kt
          package com.example.floatai
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText

          class MainActivity : Activity() {
              private val projectionManager by lazy { getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val etKey = findViewById<EditText>(R.id.etApiKey)
                  val prefs = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE)
                  etKey.setText(prefs.getString("api_key", ""))

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      prefs.edit().putString("api_key", etKey.text.toString().trim()).apply()
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          startActivityForResult(projectionManager.createScreenCaptureIntent(), 1001)
                      }
                  }
                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, FloatingService::class.java))
                  }
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001 && resultCode == RESULT_OK && data != null) {
                      ScreenCaptureHelper.resultCode = resultCode
                      ScreenCaptureHelper.data = data
                      startForegroundService(Intent(this, FloatingService::class.java))
                      finish()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/ScreenCaptureHelper.kt
          package com.example.floatai
          import android.content.Intent
          object ScreenCaptureHelper { var resultCode: Int = 0; var data: Intent? = null }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/FloatingService.kt
          package com.example.floatai
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.Base64
          import android.view.*
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.ByteArrayOutputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class FloatingService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var bubble: View
              private var menu: View? = null
              private var answer: View? = null
              private var loading: View? = null
              private var apiKey = ""
              private var isHidden = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  apiKey = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE).getString("api_key", "") ?: ""
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  bubble = LayoutInflater.from(this).inflate(R.layout.floating_bubble, null)
                  
                  val p = WindowManager.LayoutParams(150, 150, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = 100; p.y = 300
                  
                  bubble.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { initialX = p.x; initialY = p.y; touchX = event.rawX; touchY = event.rawY; return false }
                              MotionEvent.ACTION_MOVE -> { p.x = initialX + (event.rawX - touchX).toInt(); p.y = initialY + (event.rawY - touchY).toInt(); wm.updateViewLayout(bubble, p); return true }
                          }
                          return false
                      }
                  })

                  bubble.setOnClickListener {
                      if (isHidden) { isHidden = false; bubble.alpha = 1.0f } else { showMenu() }
                  }
                  wm.addView(bubble, p)
              }

              private fun showMenu() {
                  if (menu != null) return
                  menu = LayoutInflater.from(this).inflate(R.layout.floating_menu, null)
                  val p = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                  p.gravity = Gravity.CENTER
                  menu!!.findViewById<LinearLayout>(R.id.menuJawab).setOnClickListener { closeMenu(); showLoadingAndCapture(false) }
                  menu!!.findViewById<LinearLayout>(R.id.menuPenjelasan).setOnClickListener { closeMenu(); showLoadingAndCapture(true) }
                  
                  val switch = menu!!.findViewById<Switch>(R.id.switchSamaran)
                  switch.isChecked = isHidden
                  switch.setOnCheckedChangeListener { _, isChecked -> isHidden = isChecked; bubble.alpha = if (isHidden) 0.01f else 1.0f }
                  
                  wm.addView(menu, p)
              }

              private fun closeMenu() { if (menu != null) { wm.removeView(menu); menu = null } }

              private fun showLoadingAndCapture(penjelasan: Boolean) {
                  if (loading != null) return
                  loading = LayoutInflater.from(this).inflate(R.layout.floating_loading, null)
                  val p = WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                  wm.addView(loading, p)
                  Handler(Looper.getMainLooper()).postDelayed({ capture(penjelasan) }, 500)
              }

              private fun removeLoading() { if (loading != null) { wm.removeView(loading); loading = null } }

              private fun capture(penjelasan: Boolean) {
                  val data = ScreenCaptureHelper.data ?: return
                  val mp = (getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager).getMediaProjection(ScreenCaptureHelper.resultCode, data)
                  val m = resources.displayMetrics
                  val ir = ImageReader.newInstance(m.widthPixels, m.heightPixels, PixelFormat.RGBA_8888, 1)
                  val vd = mp.createVirtualDisplay("c", m.widthPixels, m.heightPixels, m.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir.surface, null, null)
                  thread {
                      Thread.sleep(300)
                      val img = ir.acquireLatestImage()
                      if (img != null) {
                          val planes = img.planes; val buf = planes[0].buffer
                          val bmp = Bitmap.createBitmap(m.widthPixels, m.heightPixels, Bitmap.Config.ARGB_8888)
                          bmp.copyPixelsFromBuffer(buf); img.close()
                          ask(bmp, penjelasan)
                      }
                      vd.release(); mp.stop()
                  }
              }

              private fun ask(bmp: Bitmap, penjelasan: Boolean) {
                  thread {
                      val stream = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.JPEG, 40, stream)
                      val b64 = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)
                      try {
                          val conn = URL("https://api.groq.com/openai/v1/chat/completions").openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.setRequestProperty("Authorization", "Bearer $apiKey")
                          conn.doOutput = true
                          val prompt = if (penjelasan) "Baca soal ini. Berikan jawaban dan penjelasan singkat." else "Baca soal ini. Berikan HANYA jawaban akhirnya."
                          val json = JSONObject().apply {
                              put("model", "qwen/qwen3.8-27b")
                              put("messages", JSONArray().apply { put(JSONObject().apply { put("role", "user"); put("content", JSONArray().apply { put(JSONObject().apply { put("type", "text"); put("text", prompt) }); put(JSONObject().apply { put("type", "image_url"); put("image_url", JSONObject().apply { put("url", "data:image/jpeg;base64,$b64") }) }) }) }) })
                          }
                          val os = OutputStreamWriter(conn.outputStream); os.write(json.toString()); os.flush(); os.close()
                          if (conn.responseCode == 200) {
                              val r = BufferedReader(InputStreamReader(conn.inputStream))
                              val res = StringBuilder(); var l: String?
                              while (r.readLine().also { l = it } != null) { res.append(l) }
                              r.close()
                              val ans = JSONObject(res.toString()).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content")
                              Handler(Looper.getMainLooper()).post { removeLoading(); show(ans) }
                          } else {
                              Handler(Looper.getMainLooper()).post { removeLoading(); show("Error: ${conn.responseCode}") }
                          }
                      } catch (e: Exception) { Handler(Looper.getMainLooper()).post { removeLoading(); show("Koneksi lambat (Timeout)") } }
                  }
              }

              private fun show(text: String) {
                  if (answer == null) {
                      answer = LayoutInflater.from(this).inflate(R.layout.floating_answer, null)
                      val p = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                      p.gravity = Gravity.CENTER
                      answer!!.setOnClickListener { wm.removeView(answer); answer = null }
                      wm.addView(answer, p)
                  }
                  answer!!.findViewById<TextView>(R.id.tvAnswer).text = text
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
